# Arm A (decisions D2, D10, D11): 24-layer FlowLM from random init, frozen released Mimi.
# Upstream scratch.yaml with our data/tokenizer; effective batch 16 x 2 GPUs x 2 accum = 64.
model_config: /home/ubuntu/hindi-tts/configs/hinglish_24l.yaml
start_from_pretrained: false

data:
  train_jsonl: /home/ubuntu/hindi-tts/data/v0/train_aligned.jsonl
  valid_jsonl: /home/ubuntu/hindi-tts/data/v0/valid_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  schedule: cosine
  warmup_steps: 1000

run_dir: /home/ubuntu/hindi-tts/runs/scratch_v0
batch_size: 16
grad_accum_steps: 2
max_steps: 400000
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 4
sample_freq: 5000
sample_cfg_coef: 2.0
sample_sentences:
  - "आज मौसम बहुत अच्छा है और हम सब बाहर घूमने जा रहे हैं"
  - "कल की meeting तीन बजे reschedule कर देना और updated link मुझे भेज देना"
  - "The quick brown fox jumps over the lazy dog."
